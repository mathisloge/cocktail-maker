default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.19.3
    hooks:
      - id: commitizen
        stages: [commit-msg]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^(mkdocs|.clang-format)
      - id: check-toml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^(plugins|docs/ui|docs/tests|tools/palette)/
      - id: ruff-format
        files: ^(plugins|docs/ui|docs/tests|tools/palette)/

  - repo: https://github.com/BlankSpruce/gersemi-pre-commit
    rev: 0.28.1
    hooks:
      - id: gersemi
        name: CMake linting

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.0
    hooks:
      - id: clang-format
        types_or: [c++, c, proto]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        exclude: ^(i18n|v2.md)

  - repo: local
    hooks:
      - id: reuse-annotate
        name: reuse-annotate
        entry: reuse annotate -l "AGPL-3.0-or-later" --merge-copyrights --single-line -c "Mathis Logemann <mathis@quite.rocks>"
        additional_dependencies: ["reuse"]
        types_or: [c++, qml, proto, cmake, python, pyi]
        pass_filenames: true
        language: python
        stages: [ manual ]
      - id: adoc-style
        name: AsciiDoc writing style
        entry: plugins/cocktail-maker-docs/scripts/check_adoc_style.py
        language: script
        files: ^docs/(system|station)/.*\.adoc$
        verbose: true
      - id: palette-generated
        name: Docs palette matches colors.slint
        entry: tools/palette/generate_palette.py --check
        language: script
        pass_filenames: false
        files: ^(gui/ui/theme/colors\.slint|tools/palette/.*|docs/ui/supplemental/css/palette\.css|docs/system/modules/ROOT/partials/d2-style\.d2)$
